<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>サロンのLINE予約（デモ）｜よだき屋</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --ink: #2c2b31; --sub: #6f6a76; --line: #e2dbd0; --bg: #f3efe7; --marine: #245c68; --accent: #b1802f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif; line-height: 1.7; }
  .top { background: #fff; border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1320px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .badge { font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); padding: 2px 10px; border-radius: 999px; }
  h1 { font-size: 18px; margin: 0; }
  .lead { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--sub); }
  .back { margin-left: auto; font-size: 13px; color: var(--marine); font-weight: 700; text-decoration: none; }
  .stage { max-width: 1320px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 400px 1fr; gap: 24px; align-items: start; }
  .cap { font-size: 13px; font-weight: 700; color: var(--sub); margin: 0 0 8px; text-align: center; }
  .phone { border: 10px solid #1f1d22; border-radius: 36px; overflow: hidden; height: min(820px, calc(100vh - 150px)); min-height: 600px; background: #fff; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
  .store { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; height: min(820px, calc(100vh - 150px)); min-height: 600px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  @media (max-width: 960px) {
    .stage { grid-template-columns: 1fr; }
    .phone { max-width: 400px; margin: 0 auto; height: 720px; }
    .store { height: 720px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="badge">デモ</span>
    <h1>サロンのLINE予約（ひだまり）</h1>
    <a class="back" href="/">← よだき屋のホームページへ</a>
    <p class="lead">左がお客様のスマホ（LINEから開く予約画面）、右がお店の管理画面です。左で予約すると、右の予約一覧に届きます。店名・メニュー・お客様はすべて架空で、データはこのブラウザの中だけに保存されます。</p>
  </div>
</header>
<main class="stage">
  <section aria-label="お客様のスマホ画面">
    <p class="cap">お客様のスマホ</p>
    <div class="phone"><iframe src="./index.html" title="お客様の予約画面"></iframe></div>
  </section>
  <section aria-label="お店の管理画面">
    <p class="cap">お店の管理画面</p>
    <div class="store"><iframe src="./index.html#store" title="お店の管理画面"></iframe></div>
  </section>
</main>
</body>
</html>
